<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비상 연락처</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        /* 다국어 선택창 */
        .lang-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
            text-align: center;
        }
        
        /* 1. 비상 연락처 타이틀 (비율 2.0 = 48px) */
        h1 { 
            color: #ff5252; 
            font-size: 48px; 
            margin: 10px 0 25px 0; 
            word-break: keep-all;
        }
        
        /* 2. 승강기 위치 정보 박스 (비율 1.0 = 24px) */
        .info-box {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center; 
            border: 1px solid #444; 
        }
        .info-box p { margin: 10px 0; line-height: 1.6; }
        .label { font-size: 24px; color: #b0bec5; font-weight: normal; }
        .value { font-size: 24px; color: #ffffff; font-weight: bold; }
        
        /* 3. 버튼 텍스트 (비율 1.5 = 36px) */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 140px;
            margin-bottom: 20px;
            border-radius: 15px;
            font-size: 36px;
            font-weight: 900;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            word-break: keep-all;
            line-height: 1.3;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: transform 0.1s;
            text-align: center;
        }
        
        /* 버튼 순서: 문자 신고(위, 파랑), 역무실 통화(아래, 녹색) */
        .btn-sms { background-color: #2196F3; } 
        .btn-sms:active { background-color: #1e88e5; transform: scale(0.98); }

        .btn-call { background-color: #4CAF50; } 
        .btn-call:active { background-color: #45a049; transform: scale(0.98); } 
    </style>
</head>
<body>

    <div class="container">
        <!-- 4개 국어 선택 -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <h1 id="pageTitle">비상 연락처</h1>
        
        <!-- 엘리베이터 위치 정보 (승강기번호 삭제 완료) -->
        <div class="info-box">
            <p>
                <span id="locLabel" class="label">위치</span><br>
                <span id="locValue" class="value">신금호역 엘리베이터 3호기</span>
            </p>
        </div>

        <!-- 1. 문자 신고 버튼 (상단 배치) -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            1577-1234<br>문자 신고
        </button>

        <!-- 2. 전화 연결 버튼 (하단 배치, 동적 전화번호 바인딩) -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            역무실<br>통화 연결
        </a>
    </div>

    <script>
        // 70여 개 엘리베이터 데이터베이스 (엑셀 내용이 이곳으로 들어옵니다)
        const elevatorDatabase = {
            "1": {
                locationKo: "신금호역 엘리베이터 3호기",
                locationEn: "Singumho Station Elevator No.3",
                locationJa: "新金湖駅 エレベーター3号機",
                locationZh: "新金湖站 3号电梯",
                phone: "02-6311-5382"
            },
            "2": {
                locationKo: "신금호역 엘리베이터 4호기",
                locationEn: "Singumho Station Elevator No.4",
                locationJa: "新金湖駅 エレベーター4号機",
                locationZh: "新金湖站 4号电梯",
                phone: "02-6311-5382"
            },
            "3": {
                locationKo: "청구역 엘리베이터 1호기",
                locationEn: "Cheonggu Station Elevator No.1",
                locationJa: "青丘駅 エレベーター1号機",
                locationZh: "青丘站 1号电梯",
                phone: "02-6311-5371"
            }
            // 향후 엑셀의 70개 데이터를 아래로 계속 추가할 수 있습니다.
        };

        // URL 파라미터(?id=1 등) 추출
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id') || "1"; // 파라미터가 없으면 기본 1번

        // 해당 승강기 정보 불러오기 (없으면 신금호역 3호기 기본값)
        const currentElevator = elevatorDatabase[currentId] || {
            locationKo: "신금호역 엘리베이터 3호기",
            locationEn: "Singumho Station Elevator No.3",
            locationJa: "新金湖駅 エレベーター3号機",
            locationZh: "新金湖站 3号电梯",
            phone: "02-6311-5382"
        };

        // 4개 언어 텍스트 정의
        const langData = {
            ko: {
                title: "비상 연락처",
                locPrefix: "위치",
                btnSms: "1577-1234\n문자 신고",
                btnCall: "역무실\n통화 연결",
                getSmsBody: (loc) => `[승강기 갇힘 신고]\n- 위치: ${loc}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Emergency Contacts",
                locPrefix: "Location",
                btnSms: "Send SMS\n(1577-1234)",
                btnCall: "Call Station\nStaff",
                getSmsBody: (loc) => `[Elevator Emergency]\n- Location: ${loc}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "緊急連絡先",
                locPrefix: "位置",
                btnSms: "SMSを送信\n(1577-1234)",
                btnCall: "駅係員に\n電話する",
                getSmsBody: (loc) => `[エレベーター閉じ込め]\n- 位置: ${loc}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "紧急联系方式",
                locPrefix: "位置",
                btnSms: "发送报警短信\n(1577-1234)",
                btnCall: "拨打\n值班室电话",
                getSmsBody: (loc) => `[电梯困人报警]\n- 位置: ${loc}\n我被困在电梯里了，请速来救援。`
            }
        };

        // 현재 언어별 위치명 가져오기
        function getCurrentLocation(lang) {
            if (lang === 'en') return currentElevator.locationEn || currentElevator.locationKo;
            if (lang === 'ja') return currentElevator.locationJa || currentElevator.locationKo;
            if (lang === 'zh') return currentElevator.locationZh || currentElevator.locationKo;
            return currentElevator.locationKo;
        }

        // 언어 변경 함수
        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('locLabel').innerText = langData[lang].locPrefix;
            document.getElementById('locValue').innerText = locText;
            
            document.getElementById('btnSms').innerHTML = langData[lang].btnSms.replace(/\n/g, '<br>');
            document.getElementById('btnCall').innerHTML = langData[lang].btnCall.replace(/\n/g, '<br>');
            
            // 해당 역 전화번호로 통화 연결 링크 동적 갱신
            document.getElementById('btnCall').href = "tel:" + currentElevator.phone;
        }

        // 1577-1234 문자 전송 함수 (승강기번호 삭제 및 위치만 전송)
        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            const message = langData[lang].getSmsBody(locText);
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // iOS 규격
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                // Android 규격
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        // 초기 화면 로드
        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
