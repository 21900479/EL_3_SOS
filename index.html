<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>승강기 비상 호출 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .lang-selector {
            margin-bottom: 20px;
            text-align: right;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
        }
        
        h1 { color: #ff5252; font-size: 26px; margin-bottom: 15px; }
        .info-box {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 5px solid #ff5252;
            text-align: left;
        }
        .info-box p { margin: 5px 0; font-size: 18px; font-weight: bold; }
        
        /* 버튼 크기 및 시인성 강화 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 140px; /* 세로 크기 2배 이상 확대 */
            margin-bottom: 20px;
            border-radius: 15px;
            font-size: 32px; /* 글자 크기 대폭 확대 */
            font-weight: 900; /* 글씨 굵기 최대 */
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            word-break: keep-all; /* 단어 단위로 줄바꿈 방지 */
            line-height: 1.3;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); /* 버튼 입체감 강조 */
            transition: transform 0.1s;
        }
        .btn-call { background-color: #4CAF50; } 
        .btn-call:active { background-color: #45a049; transform: scale(0.98); } 
        
        .btn-sms { background-color: #2196F3; } 
        .btn-sms:active { background-color: #1e88e5; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <!-- 다국어 선택 -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">🇰🇷 한국어</option>
                <option value="en">🇺🇸 English</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
        </div>

        <h1 id="pageTitle">승강기 비상 호출</h1>
        
        <!-- 엘리베이터 위치 정보 반영 -->
        <div class="info-box">
            <p id="infoLocation">📍 위치: 신금호역 엘리베이터 3호기</p>
            <p id="infoNumber">🔢 번호: 0102-619</p>
        </div>

        <!-- 1. 전화 연결 버튼 -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            📞 역무실<br>통화 연결
        </a>

        <!-- 2. 문자 전송 버튼 -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            💬 1577-1234<br>문자 신고
        </button>
    </div>

    <script>
        // 엘리베이터 상세 정보 입력
        const elevatorInfo = {
            station: "신금호역 엘리베이터 3호기",
            number: "0102-619"
        };

        const langData = {
            ko: {
                title: "승강기 갇힘 긴급 호출",
                locPrefix: "📍 위치: ",
                numPrefix: "🔢 번호: ",
                btnCall: "📞 역무실\n통화 연결",
                btnSms: "💬 1577-1234\n문자 신고",
                smsBody: `[승강기 갇힘 신고]\n- 위치: ${elevatorInfo.station}\n- 승강기번호: ${elevatorInfo.number}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Elevator Emergency Call",
                locPrefix: "📍 Location: ",
                numPrefix: "🔢 Number: ",
                btnCall: "📞 Call Station\nStaff",
                btnSms: "💬 Send SMS\n(1577-1234)",
                smsBody: `[Elevator Emergency]\n- Location: ${elevatorInfo.station}\n- No: ${elevatorInfo.number}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "エレベーター緊急通報",
                locPrefix: "📍 位置: ",
                numPrefix: "🔢 番号: ",
                btnCall: "📞 駅係員に\n電話する",
                btnSms: "💬 SMSを送信\n(1577-1234)",
                smsBody: `[エレベーター閉じ込め]\n- 位置: ${elevatorInfo.station}\n- 番号: ${elevatorInfo.number}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "电梯紧急呼叫",
                locPrefix: "📍 位置: ",
                numPrefix: "🔢 编号: ",
                btnCall: "📞 拨打\n值班室电话",
                btnSms: "💬 发送报警短信\n(1577-1234)",
                smsBody: `[电梯困人报警]\n- 位置: ${elevatorInfo.station}\n- 编号: ${elevatorInfo.number}\n我被困在电梯里了，请速来救援。`
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('infoLocation').innerText = langData[lang].locPrefix + elevatorInfo.station;
            document.getElementById('infoNumber').innerText = langData[lang].numPrefix + elevatorInfo.number;
            
            // \n 문자를 HTML의 <br> 태그로 변환하여 텍스트 줄바꿈 적용
            document.getElementById('btnCall').innerHTML = langData[lang].btnCall.replace(/\n/g, '<br>');
            document.getElementById('btnSms').innerHTML = langData[lang].btnSms.replace(/\n/g, '<br>');
        }

        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const message = langData[lang].smsBody;
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
