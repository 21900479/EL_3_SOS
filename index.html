<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>갇힘 신고</title>
    <style>
        /* 1. Noto Sans CJK 웹 폰트 로드 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+SC:wght@700;900&display=swap');

        /* 2. 전역 폰트 적용 및 기본 배경 (심리적 안정을 주는 어두운 네이비톤) */
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
            background-color: #12183b; /* 눈부심 방지용 딥 네이비 */
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            word-break: keep-all; 
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1A237E; /* 메인 네이비 컨테이너 */
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            border: 1px solid #283593;
            box-sizing: border-box;
        }
        
        /* 다국어 선택창 (다크 테마에 맞게 톤다운) */
        .lang-selector {
            margin-bottom: 24px;
            text-align: center;
            height: 40px; 
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            background-color: #283593;
            color: #ffffff;
            border: 1px solid #5C6BC0;
            text-align: center;
            font-family: inherit;
            font-weight: 700;
        }
        
        /* 타이틀: 구조 옐로우 색상 적용으로 확실한 각인 효과 */
        h1 { 
            color: #FFC107; /* 구조 옐로우 */
            font-size: 40px; 
            margin: 0 0 24px 0; 
            font-weight: 900;
            letter-spacing: -1px;
            height: 58px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 공통 버튼 스타일 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center; 
            width: 100%;
            height: 140px; 
            margin-bottom: 20px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        /* 텍스트 우측 일치 & 내부 중앙 정렬을 위한 Grid 래퍼 */
        .btn-content {
            display: grid;
            grid-template-columns: 48px 1fr; 
            align-items: center;
            width: 300px; 
            gap: 20px; 
            margin: 0 auto; 
        }
        
        /* 버튼 내 SVG 아이콘 */
        .btn-icon {
            width: 100%;
            height: auto;
            fill: currentColor; 
        }
        
        /* 전화기 아이콘 수직 보정 유지 */
        .icon-call {
            margin-left: -4px; 
        }

        /* 버튼 내 텍스트 */
        .btn-text {
            font-size: 32px; 
            font-weight: 900;
            line-height: 1.3;
            text-align: center; 
            letter-spacing: -1px;
            width: 100%;
        }

        /* 버튼 1: 문자 신고 (상단) - 안전 오렌지 바탕 + 흰색 아이콘/글씨 */
        .btn-sms { 
            background-color: #FF9800; /* 안전 오렌지 */
            color: #ffffff; 
            border: none;
            box-shadow: 0 8px 16px rgba(255, 152, 0, 0.35);
        } 
        .btn-sms:active { 
            background-color: #F57C00; 
            transform: scale(0.98); 
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.35);
        }

        /* 버튼 2: 통화 연결 (중간) - 흰 바탕 + 오렌지 테두리/아이콘/글씨 (이전 대비규칙 유지) */
        .btn-call { 
            background-color: #ffffff; 
            color: #FF9800; 
            border: 4px solid #FF9800; 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        } 
        .btn-call:active { 
            background-color: #fff3e0; 
            transform: scale(0.98); 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* 승강기 위치 정보 박스 */
        .info-box {
            background-color: #12183b; /* 본문 배경과 맞춰 깊이감 형성 */
            border-radius: 12px;
            margin-top: 12px;
            margin-bottom: 8px;
            border: 2px solid #3949AB; 
            height: 140px; 
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            gap: 8px; 
        }
        .info-box p { 
            margin: 0; 
            text-align: center;
        }
        
        .label { 
            font-size: 18px; 
            color: #9FA8DA; /* 연한 파스텔 블루 */
            font-weight: 700; 
        }
        .value { 
            font-size: 28px; 
            color: #ffffff; 
            font-weight: 900; 
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 4개 국어 선택 -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <!-- 타이틀 (갇힘 신고) -->
        <h1 id="pageTitle">갇힘 신고</h1>
        
        <!-- 1. 문자 신고 버튼 -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            <div class="btn-content">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                </svg>
                <span class="btn-text" id="textSms"></span>
            </div>
        </button>

        <!-- 2. 전화 연결 버튼 -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            <div class="btn-content">
                <svg class="btn-icon icon-call" viewBox="0 0 24 24">
                    <path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.2c.28-.27.36-.66.25-1.02C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
                </svg>
                <span class="btn-text" id="textCall"></span>
            </div>
        </a>

        <!-- 3. 엘리베이터 위치 정보 박스 -->
        <div class="info-box">
            <p>
                <span id="locLabel" class="label">위치</span><br>
                <span id="locValue" class="value">신금호역 엘리베이터 1호기</span>
            </p>
        </div>
    </div>

    <script>
        // 엘리베이터 데이터베이스 (?id=1: 1호기, ?id=2: 2호기, ?id=3: 3호기)
        const elevatorDatabase = {
            "1": { 
                locationKo: "신금호역 엘리베이터 1호기",
                locationEn: "Singumho Station Elevator No.1",
                locationJa: "新金湖駅 エレベーター1号機",
                locationZh: "新金湖站 1号电梯",
                phone: "02-6311-5382"
            },
            "2": { 
                locationKo: "신금호역 엘리베이터 2호기",
                locationEn: "Singumho Station Elevator No.2",
                locationJa: "新金湖駅 エレベーター2号機",
                locationZh: "新金湖站 2号电梯",
                phone: "02-6311-5382"
            },
            "3": { 
                locationKo: "신금호역 엘리베이터 3호기",
                locationEn: "Singumho Station Elevator No.3",
                locationJa: "新金湖駅 エレベーター3号機",
                locationZh: "新金湖站 3号电梯",
                phone: "02-6311-5382"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id') || "1";

        const currentElevator = elevatorDatabase[currentId] || elevatorDatabase["1"];

        // 4개 언어 데이터베이스 ((1577-1234) 줄바꿈 방지 코드 포함)
        const langData = {
            ko: {
                title: "갇힘 신고",
                locPrefix: "위치",
                btnSms: "<span style='white-space: nowrap;'>1577-1234</span><br>문자 신고",
                btnCall: "역무실<br>통화 연결",
                getSmsBody: (loc) => `[승강기 갇힘 신고]\n- 위치: ${loc}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Emergency Call",
                locPrefix: "Location",
                btnSms: "Send SMS<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "Call Station<br>Staff",
                getSmsBody: (loc) => `[Elevator Emergency]\n- Location: ${loc}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "閉じ込め通報",
                locPrefix: "位置",
                btnSms: "SMSを送信<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "駅係員に<br>電話する",
                getSmsBody: (loc) => `[エレベーター閉じ込め]\n- 位置: ${loc}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "困人报警",
                locPrefix: "位置",
                btnSms: "发送报警短信<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "拨打<br>值班室电话",
                getSmsBody: (loc) => `[电梯困人报警]\n- 位置: ${loc}\n我被困在电梯里了，请速来救援。`
            }
        };

        function getCurrentLocation(lang) {
            if (lang === 'en') return currentElevator.locationEn || currentElevator.locationKo;
            if (lang === 'ja') return currentElevator.locationJa || currentElevator.locationKo;
            if (lang === 'zh') return currentElevator.locationZh || currentElevator.locationKo;
            return currentElevator.locationKo;
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('locLabel').innerText = langData[lang].locPrefix;
            document.getElementById('locValue').innerText = locText;
            
            // 번역 텍스트를 HTML 코드로 변환하여 주입 (<br>과 <span> 태그 정상 작동)
            document.getElementById('textSms').innerHTML = langData[lang].btnSms;
            document.getElementById('textCall').innerHTML = langData[lang].btnCall;
            
            document.getElementById('btnCall').href = "tel:" + currentElevator.phone;
        }

        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            const message = langData[lang].getSmsBody(locText);
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
