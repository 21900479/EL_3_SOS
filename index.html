<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ef3835" />
    <title>갇힘 신고</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+SC:wght@700;900&display=swap");

      :root {
        font-family:
          "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", system-ui,
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17191d;
        background: #f0f2f5;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
      }

      button,
      select {
        font: inherit;
      }

      .page-shell {
        display: flex;
        min-height: 100dvh;
        align-items: flex-start;
        justify-content: center;
        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(255, 255, 255, 0.95) 0,
            transparent 340px
          ),
          #f0f2f5;
      }

      .emergency-card {
        width: min(100%, 400px);
        padding: 30px 20px 36px;
        text-align: center;
        word-break: keep-all;
        background: #ffffff;
        border: 1px solid #dfe2e6;
        border-radius: 18px;
        box-shadow: 0 14px 36px rgba(26, 32, 44, 0.08);
      }

      .language-control {
        height: 46px;
        margin-bottom: 22px;
      }

      .language-control select {
        min-width: 112px;
        min-height: 44px;
        padding: 8px 34px 8px 16px;
        color: #292d32;
        font-size: 16px;
        font-weight: 700;
        text-align: center;
        background-color: #ffffff;
        border: 1px solid #9ca0a6;
        border-radius: 7px;
        cursor: pointer;
      }

      h1 {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        margin: 0 0 22px;
        color: #ef3835;
        font-size: clamp(34px, 10vw, 40px);
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.055em;
      }

      .actions {
        display: grid;
        gap: 20px;
      }

      .emergency-action {
        display: grid;
        width: 100%;
        min-height: 140px;
        grid-template-columns: 48px minmax(0, 1fr) 48px;
        align-items: center;
        padding: 18px 22px;
        color: #ef3835;
        text-decoration: none;
        border-radius: 20px;
        cursor: pointer;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          background-color 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .action-icon {
        display: flex;
        width: 48px;
        align-items: center;
        justify-content: center;
      }

      .action-icon svg {
        width: 43px;
        height: 43px;
        fill: currentColor;
      }

      .phone-icon {
        transform: translateX(-2px);
      }

      .action-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        grid-column: 2;
        font-size: clamp(27px, 7.8vw, 32px);
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -0.045em;
      }

      .nowrap {
        white-space: nowrap;
      }

      .sms-action {
        color: #ffffff;
        background: #ef3835;
        border: 0;
        box-shadow: 0 9px 18px rgba(229, 57, 53, 0.32);
      }

      .call-action {
        background: #ffffff;
        border: 4px solid #ef3835;
        box-shadow: 0 8px 16px rgba(229, 57, 53, 0.09);
      }

      .location-card {
        display: flex;
        min-height: 140px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        margin-top: 20px;
        padding: 18px 16px;
        background: #f8f9fa;
        border: 2px solid #cfd8dc;
        border-radius: 12px;
      }

      .location-label {
        color: #546e7a;
        font-size: 18px;
        font-weight: 700;
      }

      .location-value {
        font-size: clamp(23px, 6.8vw, 28px);
        font-weight: 900;
        line-height: 1.35;
        letter-spacing: -0.04em;
      }

      .emergency-action:hover {
        transform: translateY(-1px);
      }

      .sms-action:hover {
        background: #e63330;
        box-shadow: 0 11px 22px rgba(229, 57, 53, 0.36);
      }

      .call-action:hover {
        background: #fff8f8;
      }

      .emergency-action:active {
        transform: scale(0.985);
      }

      .language-control select:focus-visible,
      .emergency-action:focus-visible {
        outline: 4px solid rgba(29, 78, 216, 0.28);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (min-height: 780px) and (min-width: 600px) {
        .page-shell {
          align-items: center;
        }
      }

      @media (max-width: 380px) {
        .page-shell {
          padding-right: 12px;
          padding-left: 12px;
        }

        .emergency-card {
          padding: 24px 16px 28px;
        }

        .emergency-action {
          min-height: 132px;
          grid-template-columns: 40px minmax(0, 1fr) 40px;
          padding-right: 14px;
          padding-left: 14px;
        }

        .action-icon {
          width: 40px;
        }

        .action-icon svg {
          width: 38px;
          height: 38px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .emergency-action {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page-shell">
      <section class="emergency-card" aria-labelledby="page-title">
        <div class="language-control">
          <label class="sr-only" for="language">Language</label>

          <select id="language">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
        </div>

        <h1 id="page-title">갇힘 신고</h1>

        <div class="actions">
          <button
            id="sms-button"
            class="emergency-action sms-action"
            type="button"
          >
            <span class="action-icon">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM6 6h12v2H6V6Zm0 3h12v2H6V9Zm0 3h8v2H6v-2Z"
                />
              </svg>
            </span>

            <span id="sms-text" class="action-copy">
              <span class="nowrap">1577-1234</span>
              <span>문자 신고</span>
            </span>
          </button>

          <a
            id="call-button"
            class="emergency-action call-action"
            href="tel:02-6311-5382"
          >
            <span class="action-icon phone-icon">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1.03 1.03 0 0 0-1.02.24l-2.2 2.2a15.1 15.1 0 0 1-6.59-6.59l2.2-2.2c.28-.27.36-.66.25-1.02A11.4 11.4 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1Z"
                />
              </svg>
            </span>

            <span id="call-text" class="action-copy">
              <span>역무실</span>
              <span>통화 연결</span>
            </span>
          </a>
        </div>

        <div class="location-card">
          <span id="location-label" class="location-label">위치</span>
          <strong id="location-value" class="location-value">
            신금호역 엘리베이터 1호기
          </strong>
        </div>
      </section>
    </main>

    <script>
      const elevators = {
        "1": {
          phone: "02-6311-5382",
          locations: {
            ko: "신금호역 엘리베이터 1호기",
            en: "Singumho Station Elevator No. 1",
            ja: "新金湖駅 エレベーター1号機",
            zh: "新金湖站 1号电梯",
          },
        },
        "2": {
          phone: "02-6311-5382",
          locations: {
            ko: "신금호역 엘리베이터 2호기",
            en: "Singumho Station Elevator No. 2",
            ja: "新金湖駅 エレベーター2号機",
            zh: "新金湖站 2号电梯",
          },
        },
        "3": {
          phone: "02-6311-5382",
          locations: {
            ko: "신금호역 엘리베이터 3호기",
            en: "Singumho Station Elevator No. 3",
            ja: "新金湖駅 エレベーター3号機",
            zh: "新金湖站 3号电梯",
          },
        },
      };

      const translations = {
        ko: {
          title: "갇힘 신고",
          location: "위치",
          sms: '<span class="nowrap">1577-1234</span><span>문자 신고</span>',
          call: "<span>역무실</span><span>통화 연결</span>",
          message(location) {
            return `[승강기 갇힘 신고]\n- 위치: ${location}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`;
          },
        },

        en: {
          title: "Emergency Call",
          location: "Location",
          sms: '<span>Send SMS</span><span class="nowrap">(1577-1234)</span>',
          call: "<span>Call Station</span><span>Staff</span>",
          message(location) {
            return `[Elevator Emergency]\n- Location: ${location}\nI am stuck in the elevator. Please help.`;
          },
        },

        ja: {
          title: "閉じ込め通報",
          location: "位置",
          sms: '<span>SMSを送信</span><span class="nowrap">(1577-1234)</span>',
          call: "<span>駅係員に</span><span>電話する</span>",
          message(location) {
            return `[エレベーター閉じ込め]\n- 位置: ${location}\nエレベーターに閉じ込められました。救助をお願いします。`;
          },
        },

        zh: {
          title: "困人报警",
          location: "位置",
          sms: '<span>发送报警短信</span><span class="nowrap">(1577-1234)</span>',
          call: "<span>拨打</span><span>值班室电话</span>",
          message(location) {
            return `[电梯困人报警]\n- 位置: ${location}\n我被困在电梯里了，请速来救援。`;
          },
        },
      };

      const parameters = new URLSearchParams(window.location.search);
      const elevatorId = parameters.get("id") || "1";
      const elevator = elevators[elevatorId] || elevators["1"];

      const languageSelect = document.getElementById("language");
      const pageTitle = document.getElementById("page-title");
      const smsText = document.getElementById("sms-text");
      const callText = document.getElementById("call-text");
      const smsButton = document.getElementById("sms-button");
      const callButton = document.getElementById("call-button");
      const locationLabel = document.getElementById("location-label");
      const locationValue = document.getElementById("location-value");

      function updateLanguage() {
        const language = languageSelect.value;
        const translation = translations[language];
        const location = elevator.locations[language];

        document.documentElement.lang = language;
        document.title = translation.title;

        pageTitle.textContent = translation.title;
        smsText.innerHTML = translation.sms;
        callText.innerHTML = translation.call;
        locationLabel.textContent = translation.location;
        locationValue.textContent = location;
        callButton.href = `tel:${elevator.phone}`;
      }

      function sendSms() {
        const language = languageSelect.value;
        const translation = translations[language];
        const location = elevator.locations[language];
        const message = translation.message(location);
        const targetNumber = "15771234";

        const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const separator = isAppleDevice ? "&" : "?";

        window.location.href =
          `sms:${targetNumber}${separator}body=${encodeURIComponent(message)}`;
      }

      languageSelect.addEventListener("change", updateLanguage);
      smsButton.addEventListener("click", sendSms);

      updateLanguage();
    </script>
  </body>
</html>
