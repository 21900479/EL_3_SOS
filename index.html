<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"> <!-- 확대/축소 허용 -->
    <title>갇힘 신고 - Elevator Emergency</title>
    <style>
        /* 1. Noto Sans CJK 웹 폰트 로드 (다국어 렌더링 최적화) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+SC:wght@700;900&display=swap');

        /* 2. 전역 폰트 및 배경 (심리적 안정 다크 네이비) */
        body {
            /* Fallback 폰트를 촘촘하게 배치하여 깨짐 방지 */
            font-family: 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #12183b; 
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            word-break: keep-all; 
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
            background: #1A237E; 
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            border: 1px solid #283593;
            box-sizing: border-box;
        }
        
        /* 다국어 선택창 (접근성 라벨링 추가 대비) */
        .lang-selector {
            margin-bottom: 24px;
            text-align: center;
        }
        select {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            background-color: #283593;
            color: #ffffff;
            border: 1px solid #5C6BC0;
            text-align: center;
            font-family: inherit;
            font-weight: 700;
        }
        
        /* 타이틀 */
        h1 { 
            color: #FFC107; /* 구조 옐로우 */
            font-size: clamp(32px, 8vw, 40px); /* 좁은 화면 대응 유동적 크기 */
            margin: 0 0 20px 0; 
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        /* 3. 승강기 위치 정보 박스 (상단으로 이동) */
        .info-box {
            background-color: #12183b; 
            border-radius: 12px;
            margin-bottom: 24px;
            border: 2px solid #5C6BC0; 
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            gap: 6px; 
        }
        .info-box p { 
            margin: 0; 
            text-align: center;
        }
        .label { 
            font-size: 16px; 
            color: #9FA8DA; 
            font-weight: 700; 
        }
        .value { 
            font-size: clamp(20px, 6vw, 26px); /* 긴 영어 텍스트 좁은 화면 대응 */
            color: #ffffff; 
            font-weight: 900; 
            letter-spacing: -0.5px;
            line-height: 1.3;
        }
        
        /* 4. 버튼 공통 스타일 (고정 높이 폐기, 내용물에 맞게 늘어남) */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center; 
            width: 100%;
            min-height: 120px; /* 고정 대신 최소 높이 적용 */
            padding: 20px 16px; /* 내부 여백으로 유연성 확보 */
            margin-bottom: 16px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .btn-content {
            display: grid;
            grid-template-columns: 48px 1fr; 
            align-items: center;
            width: 100%; 
            max-width: 320px; /* 넘치지 않게 제한 */
            gap: 16px; 
            margin: 0 auto; 
        }
        
        .btn-icon {
            width: 100%;
            height: auto;
            fill: currentColor; 
        }
        .icon-call {
            margin-left: -2px; 
        }

        .btn-text {
            font-size: clamp(24px, 7vw, 30px); /* 좁은 화면 대응 */
            font-weight: 900;
            line-height: 1.25;
            text-align: left; 
            letter-spacing: -1px;
            width: 100%;
        }

        /* 버튼 1: 문자 신고 (흰 바탕 + 다크 네이비 글씨/아이콘 + 오렌지 테두리) - 명도 대비 극대화 */
        .btn-sms { 
            background-color: #ffffff; 
            color: #1A237E; /* 고대비 다크 네이비 */
            border: 5px solid #FF9800; /* 오렌지 테두리 유지 */
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        } 
        .btn-sms:active { 
            background-color: #f5f5f5; 
            transform: scale(0.98); 
        }

        /* 버튼 2: 통화 연결 (오렌지 바탕 + 다크 네이비 글씨/아이콘) - 명도 대비 극대화 */
        .btn-call { 
            background-color: #FF9800; 
            color: #1A237E; /* 고대비 다크 네이비 */
            border: none;
            box-shadow: 0 8px 16px rgba(255, 152, 0, 0.3);
        } 
        .btn-call:active { 
            background-color: #F57C00; 
            transform: scale(0.98); 
        }

        /* 5. 행동 유도 및 매뉴얼 폴백 텍스트 (하단 추가) */
        .helper-text {
            font-size: 14px;
            color: #C5CAE9; /* 연한 블루 */
            line-height: 1.5;
            margin-top: 20px;
        }
        .fallback-number {
            font-weight: 900;
            color: #FFC107;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 4개 국어 선택 -->
        <div class="lang-selector">
            <label for="langSelect" style="display:none;">언어 선택</label> <!-- 접근성 라벨 -->
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <!-- 타이틀 (갇힘 신고) -->
        <h1 id="pageTitle">갇힘 신고</h1>
        
        <!-- 3. 엘리베이터 위치 정보 박스 (최상단으로 이동) -->
        <div class="info-box">
            <p>
                <span id="locLabel" class="label">위치 확인</span><br>
                <span id="locValue" class="value">위치 확인 중...</span>
            </p>
        </div>

        <!-- 1. 문자 신고 버튼 -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            <div class="btn-content">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                </svg>
                <span class="btn-text" id="textSms"></span>
            </div>
        </button>

        <!-- 2. 전화 연결 버튼 -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            <div class="btn-content">
                <svg class="btn-icon icon-call" viewBox="0 0 24 24">
                    <path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.2c.28-.27.36-.66.25-1.02C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
                </svg>
                <span class="btn-text" id="textCall"></span>
            </div>
        </a>

        <!-- 5. 행동 유도(Next step) 및 수동 전화번호 (Manual fallback) -->
        <div class="helper-text" id="helperText">
            문자 앱이 열리면 그대로 전송해 주세요.<br>
            역무실 직통 번호: <span class="fallback-number" id="fallbackPhone">02-6311-5382</span>
        </div>
    </div>

    <script>
        // 엘리베이터 데이터베이스 (?id=1, 2, 3)
        const elevatorDatabase = {
            "1": { locationKo: "신금호역 엘리베이터 1호기", locationEn: "Singumho Station Elevator No.1", locationJa: "新金湖駅 エレベーター1号機", locationZh: "新金湖站 1号电梯", phone: "02-6311-5382" },
            "2": { locationKo: "신금호역 엘리베이터 2호기", locationEn: "Singumho Station Elevator No.2", locationJa: "新金湖駅 エレベーター2号機", locationZh: "新金湖站 2号电梯", phone: "02-6311-5382" },
            "3": { locationKo: "신금호역 엘리베이터 3호기", locationEn: "Singumho Station Elevator No.3", locationJa: "新金湖駅 エレベーター3号機", locationZh: "新金湖站 3号电梯", phone: "02-6311-5382" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id');

        // 잘못된 주소 접속 시 기본값 강제 할당 방지 및 확인 안내 처리
        const isUnknownLocation = !elevatorDatabase[currentId];
        const currentElevator = isUnknownLocation ? 
            { locationKo: "위치 확인 필요 (직원에게 역명을 알려주세요)", locationEn: "Unknown Location", locationJa: "位置確認が必要", locationZh: "需要确认位置", phone: "02-6311-5382" } 
            : elevatorDatabase[currentId];

        // 4개 언어 데이터베이스
        const langData = {
            ko: {
                title: "갇힘 신고", locPrefix: "현재 위치",
                btnSms: "<span style='white-space: nowrap;'>1577-1234</span><br>문자 신고",
                btnCall: "역무실<br>통화 연결",
                helper: "문자 앱이 열리면 그대로 전송해 주세요.<br>역무실 직통 번호: ",
                getSmsBody: (loc) => `[승강기 갇힘 신고]\n- 위치: ${loc}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Emergency Call", locPrefix: "Current Location",
                btnSms: "Send SMS<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "Call Station<br>Staff",
                helper: "Please send the message when the app opens.<br>Direct Line: ",
                getSmsBody: (loc) => `[Elevator Emergency]\n- Location: ${loc}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "閉じ込め通報", locPrefix: "現在位置",
                btnSms: "SMSを送信<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "駅係員に<br>電話する",
                helper: "メッセージアプリが開いたら、そのまま送信してください。<br>駅直通番号: ",
                getSmsBody: (loc) => `[エレベーター閉じ込め]\n- 位置: ${loc}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "困人报警", locPrefix: "当前位置",
                btnSms: "发送报警短信<br><span style='white-space: nowrap;'>(1577-1234)</span>",
                btnCall: "拨打<br>值班室电话",
                helper: "短信应用打开后，请直接发送。<br>值班室直线: ",
                getSmsBody: (loc) => `[电梯困人报警]\n- 位置: ${loc}\n我被困在电梯里了，请速来救援。`
            }
        };

        function getCurrentLocation(lang) {
            if (lang === 'en') return currentElevator.locationEn;
            if (lang === 'ja') return currentElevator.locationJa;
            if (lang === 'zh') return currentElevator.locationZh;
            return currentElevator.locationKo;
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            
            // html 문서의 언어 메타데이터 업데이트 (접근성 리더기용)
            document.documentElement.lang = lang;
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('locLabel').innerText = langData[lang].locPrefix;
            document.getElementById('locValue').innerText = locText;
            
            document.getElementById('textSms').innerHTML = langData[lang].btnSms;
            document.getElementById('textCall').innerHTML = langData[lang].btnCall;
            
            // 하단 헬퍼 텍스트 업데이트
            document.getElementById('helperText').innerHTML = langData[lang].helper + `<span class="fallback-number">${currentElevator.phone}</span>`;
            
            document.getElementById('btnCall').href = "tel:" + currentElevator.phone;
        }

        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            const message = langData[lang].getSmsBody(locText);
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
