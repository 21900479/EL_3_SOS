<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>갇힘 신고</title>
    <style>
        /* 라이트 모드 배경 유지 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f0f2f5;
            color: #1a1a1a;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }
        
        /* 다국어 선택창 */
        .lang-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #999999;
            text-align: center;
            font-weight: bold;
        }
        
        /* 1. 타이틀 (비율 2.0 = 48px) - 긴급 신고용 Red 적용 */
        h1 { 
            color: #E53935; /* 긴급 적색 */
            font-size: 48px; 
            margin: 10px 0 25px 0; 
            word-break: keep-all;
            font-weight: 900;
            letter-spacing: -1.5px;
        }
        
        /* 2. 공통 버튼 스타일 (비율 1.5 = 36px) */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 140px;
            margin-bottom: 20px;
            border-radius: 20px;
            font-size: 36px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            word-break: keep-all;
            line-height: 1.3;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            letter-spacing: -1px;
        }
        
        /* 버튼 1: 문자 신고 (상단) - 112 버튼 스타일 (흰색 바탕 + 빨강 테두리) */
        .btn-sms { 
            background-color: #ffffff; 
            color: #E53935; 
            border: 4px solid #E53935; 
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.15);
        } 
        .btn-sms:active { 
            background-color: #ffebee; 
            transform: scale(0.98); 
            box-shadow: 0 3px 8px rgba(229, 57, 53, 0.15);
        }

        /* 버튼 2: 통화 연결 (중간) - SOS 버튼 스타일 (빨강 바탕 + 흰색 글씨) */
        .btn-call { 
            background-color: #E53935; 
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
        } 
        .btn-call:active { 
            background-color: #c62828; 
            transform: scale(0.98); 
            box-shadow: 0 3px 8px rgba(229, 57, 53, 0.4);
        }

        /* 3. 승강기 위치 정보 박스 (비율 1.0 = 24px) */
        .info-box {
            background-color: #f8f9fa;
            border-radius: 12px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 2px solid #546e7a; /* 안정감을 주는 다크 그레이 테두리 */
            
            /* 어떤 언어든 칸 크기가 변하지 않도록 고정하는 핵심 CSS */
            min-height: 140px; 
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .info-box p { 
            margin: 0; 
            line-height: 1.5; 
            text-align: center;
        }
        .label { font-size: 24px; color: #546e7a; font-weight: bold; }
        .value { font-size: 24px; color: #1a1a1a; font-weight: 900; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 4개 국어 선택 -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <!-- 타이틀 (갇힘 신고) -->
        <h1 id="pageTitle">갇힘 신고</h1>
        
        <!-- 1. 문자 신고 버튼 (최상단) -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            1577-1234<br>문자 신고
        </button>

        <!-- 2. 전화 연결 버튼 (중간) -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            역무실<br>통화 연결
        </a>

        <!-- 3. 엘리베이터 위치 정보 박스 (하단 배치, 크기 고정됨) -->
        <div class="info-box">
            <p>
                <span id="locLabel" class="label">위치</span><br>
                <span id="locValue" class="value">신금호역 엘리베이터 1호기</span>
            </p>
        </div>
    </div>

    <script>
        // 엘리베이터 데이터베이스 (?id=1: 1호기, ?id=2: 2호기, ?id=3: 3호기 순서 일치)
        const elevatorDatabase = {
            "1": { 
                locationKo: "신금호역 엘리베이터 1호기",
                locationEn: "Singumho Station Elevator No.1",
                locationJa: "新金湖駅 エレベーター1号機",
                locationZh: "新金湖站 1号电梯",
                phone: "02-6311-5382"
            },
            "2": { 
                locationKo: "신금호역 엘리베이터 2호기",
                locationEn: "Singumho Station Elevator No.2",
                locationJa: "新金湖駅 エレベーター2号機",
                locationZh: "新金湖站 2号电梯",
                phone: "02-6311-5382"
            },
            "3": { 
                locationKo: "신금호역 엘리베이터 3호기",
                locationEn: "Singumho Station Elevator No.3",
                locationJa: "新金湖駅 エレベーター3号機",
                locationZh: "新金湖站 3号电梯",
                phone: "02-6311-5382"
            }
        };

        // URL 파라미터 추출 (?id=1, 2, 3)
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id') || "1"; // 기본값 1호기

        // 해당 승강기 정보 불러오기
        const currentElevator = elevatorDatabase[currentId] || elevatorDatabase["1"];

        // 4개 언어 텍스트 데이터 (영어 번역 Emergency Call로 수정)
        const langData = {
            ko: {
                title: "갇힘 신고",
                locPrefix: "위치",
                btnSms: "1577-1234\n문자 신고",
                btnCall: "역무실\n통화 연결",
                getSmsBody: (loc) => `[승강기 갇힘 신고]\n- 위치: ${loc}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Emergency Call",
                locPrefix: "Location",
                btnSms: "Send SMS\n(1577-1234)",
                btnCall: "Call Station\nStaff",
                getSmsBody: (loc) => `[Elevator Emergency]\n- Location: ${loc}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "閉じ込め通報",
                locPrefix: "位置",
                btnSms: "SMSを送信\n(1577-1234)",
                btnCall: "駅係員に\n電話する",
                getSmsBody: (loc) => `[エレベーター閉じ込め]\n- 위치: ${loc}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "困人报警",
                locPrefix: "位置",
                btnSms: "发送报警短信\n(1577-1234)",
                btnCall: "拨打\n值班室电话",
                getSmsBody: (loc) => `[电梯困人报警]\n- 위치: ${loc}\n我被困在电梯里了，请速来救援。`
            }
        };

        function getCurrentLocation(lang) {
            if (lang === 'en') return currentElevator.locationEn || currentElevator.locationKo;
            if (lang === 'ja') return currentElevator.locationJa || currentElevator.locationKo;
            if (lang === 'zh') return currentElevator.locationZh || currentElevator.locationKo;
            return currentElevator.locationKo;
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('locLabel').innerText = langData[lang].locPrefix;
            document.getElementById('locValue').innerText = locText;
            
            document.getElementById('btnSms').innerHTML = langData[lang].btnSms.replace(/\n/g, '<br>');
            document.getElementById('btnCall').innerHTML = langData[lang].btnCall.replace(/\n/g, '<br>');
            
            document.getElementById('btnCall').href = "tel:" + currentElevator.phone;
        }

        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            const message = langData[lang].getSmsBody(locText);
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
