<!DOCTYPE html>
<html lang="ko" data-lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#1e1e1e">

    <title>비상 연락처</title>


    <!-- =========================================================
         Noto Sans 폰트
         한국어 : Noto Sans KR
         영어   : Noto Sans
         일본어 : Noto Sans JP
         중국어 : Noto Sans SC
    ========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================================
           전체 기본 설정
        ========================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            background-color: #1e1e1e;
        }


        body {

            margin: 0;

            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            min-height: 100svh;

            background-color: #1e1e1e;

            color: #ffffff;

            text-align: center;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: "Noto Sans KR", sans-serif;
        }


        /* =========================================================
           언어별 폰트 자동 적용
        ========================================================== */

        html[data-lang="ko"] body {
            font-family: "Noto Sans KR", sans-serif;
        }

        html[data-lang="en"] body {
            font-family: "Noto Sans", sans-serif;
        }

        html[data-lang="ja"] body {
            font-family: "Noto Sans JP", sans-serif;
        }

        html[data-lang="zh"] body {
            font-family: "Noto Sans SC", sans-serif;
        }


        /* =========================================================
           메인 컨테이너
        ========================================================== */

        .container {

            width: 100%;

            max-width: 430px;

            margin: 0 auto;

            padding:
                24px
                20px
                calc(24px + env(safe-area-inset-bottom));

            background-color: #2a2a2a;

            border-radius: 16px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.45);
        }


        /* =========================================================
           언어 선택
        ========================================================== */

        .lang-selector {

            margin-bottom: 18px;

            text-align: center;
        }


        select {

            min-width: 160px;

            padding: 10px 38px 10px 16px;

            font-family: inherit;

            font-size: 17px;

            font-weight: 500;

            color: #ffffff;

            background-color: #444444;

            border: 1px solid #666666;

            border-radius: 8px;

            text-align: center;

            cursor: pointer;

            appearance: auto;
        }


        /* =========================================================
           메인 제목
        ========================================================== */

        h1 {

            margin:
                8px 0
                28px 0;

            color: #ff5b5b;

            font-size: clamp(40px, 12vw, 48px);

            font-weight: 800;

            line-height: 1.15;

            word-break: keep-all;

            overflow-wrap: normal;
        }


        /* =========================================================
           정보 박스
        ========================================================== */

        .info-box {

            margin-bottom: 24px;

            padding: 18px 16px;

            background-color: #333333;

            border: 1px solid #484848;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.02);
        }


        .info-box p {

            margin: 14px 0;

            line-height: 1.5;
        }


        .info-box p:first-child {
            margin-top: 4px;
        }


        .info-box p:last-child {
            margin-bottom: 4px;
        }


        /* =========================================================
           정보 라벨
        ========================================================== */

        .label {

            display: inline-block;

            margin-bottom: 3px;

            color: #b8c3c9;

            font-size: 23px;

            font-weight: 500;

            line-height: 1.4;

            word-break: keep-all;
        }


        /* =========================================================
           정보 값
        ========================================================== */

        .value {

            display: inline-block;

            color: #ffffff;

            font-size: 24px;

            font-weight: 700;

            line-height: 1.35;

            word-break: keep-all;

            overflow-wrap: normal;
        }


        /* =========================================================
           버튼 공통
        ========================================================== */

        .btn {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 136px;

            margin-bottom: 18px;

            padding: 18px 14px;

            border: none;

            border-radius: 16px;

            color: #ffffff;

            font-family: inherit;

            font-size: 35px;

            font-weight: 800;

            line-height: 1.25;

            text-align: center;

            text-decoration: none;

            white-space: pre-line;

            word-break: keep-all;

            overflow-wrap: normal;

            cursor: pointer;

            box-shadow:
                0 6px 12px rgba(0,0,0,0.35);

            transition:
                transform 0.08s ease,
                filter 0.08s ease;

            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;
        }


        .btn:last-child {
            margin-bottom: 0;
        }


        /* =========================================================
           전화 버튼
        ========================================================== */

        .btn-call {

            background-color: #5caf50;
        }


        .btn-call:active {

            background-color: #4fa344;

            transform: scale(0.98);

            filter: brightness(0.95);
        }


        /* =========================================================
           문자 버튼
        ========================================================== */

        .btn-sms {

            background-color: #398fe3;
        }


        .btn-sms:active {

            background-color: #3182d0;

            transform: scale(0.98);

            filter: brightness(0.95);
        }


        /* =========================================================
           일본어 화면
        ========================================================== */

        html[data-lang="ja"] h1 {

            line-height: 1.25;
        }


        html[data-lang="ja"] .label {

            font-size: 22px;
        }


        html[data-lang="ja"] .btn {

            line-height: 1.35;
        }


        /* =========================================================
           중국어 화면
        ========================================================== */

        html[data-lang="zh"] h1 {

            line-height: 1.25;
        }


        html[data-lang="zh"] .label {

            font-size: 22px;
        }


        html[data-lang="zh"] .btn {

            line-height: 1.35;
        }


        /* =========================================================
           작은 스마트폰
        ========================================================== */

        @media (max-width: 360px) {

            body {

                padding:
                    max(12px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }


            .container {

                padding:
                    20px
                    14px
                    calc(20px + env(safe-area-inset-bottom));

                border-radius: 14px;
            }


            h1 {

                font-size: 38px;

                margin-bottom: 22px;
            }


            .label {

                font-size: 21px;
            }


            .value {

                font-size: 22px;
            }


            .btn {

                min-height: 125px;

                font-size: 31px;
            }
        }


        /* =========================================================
           아주 작은 화면
        ========================================================== */

        @media (max-width: 320px) {

            h1 {

                font-size: 34px;
            }


            .btn {

                min-height: 115px;

                font-size: 28px;
            }


            .value {

                font-size: 20px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =====================================================
             언어 선택
        ====================================================== -->

        <div class="lang-selector">

            <select
                id="langSelect"
                aria-label="언어 선택"
                onchange="changeLanguage()">

                <option value="ko">한국어</option>

                <option value="en">English</option>

                <option value="ja">日本語</option>

                <option value="zh">中文</option>

            </select>

        </div>


        <!-- =====================================================
             제목
        ====================================================== -->

        <h1 id="pageTitle">
            비상 연락처
        </h1>


        <!-- =====================================================
             위치 / 승강기 번호
        ====================================================== -->

        <div class="info-box">


            <p>

                <span
                    id="locLabel"
                    class="label">
                    위치
                </span>

                <br>

                <span
                    id="locValue"
                    class="value">
                    신금호역 엘리베이터 3호기
                </span>

            </p>


            <p>

                <span
                    id="numLabel"
                    class="label">
                    승강기번호
                </span>

                <br>

                <span
                    id="numValue"
                    class="value">
                    0102-619
                </span>

            </p>


        </div>


        <!-- =====================================================
             역무실 전화
        ====================================================== -->

        <a
            href="tel:02-6311-5382"
            class="btn btn-call"
            id="btnCall">

            역무실
            통화 연결

        </a>


        <!-- =====================================================
             문자 신고
             ※ 화면 언어와 관계없이 SMS 내용은 한국어
        ====================================================== -->

        <button
            type="button"
            class="btn btn-sms"
            id="btnSms"
            onclick="sendSMS()">

            1577-1234
            문자 신고

        </button>


    </div>


    <script>


        /* =========================================================
           승강기 기본 정보

           서울교통공사 역명 표기 기준
           
           한국어 : 신금호
           영어   : Singeumho
           중국어 : 新金湖
           일본어 : シングムホ
        ========================================================== */

        const elevatorInfo = {

            number: "0102-619",

            location: {

                ko: "신금호역 엘리베이터 3호기",

                en: "Elevator No. 3, Singeumho Station",

                ja: "シングムホ駅 エレベーター3号機",

                zh: "新金湖站3号电梯"
            }
        };


        /* =========================================================
           화면용 다국어 데이터

           ※ SMS 내용은 여기 넣지 않음.
           ※ SMS는 아래 sendSMS()에서 항상 한국어로 생성.
        ========================================================== */

        const langData = {


            /* =====================================================
               한국어
            ====================================================== */

            ko: {

                title: "비상 연락처",

                locPrefix: "위치",

                numPrefix: "승강기번호",

                btnCall:
                    "역무실\n통화 연결",

                btnSms:
                    "1577-1234\n문자 신고"
            },


            /* =====================================================
               영어
            ====================================================== */

            en: {

                title: "Emergency Contacts",

                locPrefix: "Location",

                numPrefix: "Elevator No.",

                btnCall:
                    "Call Station\nStaff",

                btnSms:
                    "Send SMS\n(1577-1234)"
            },


            /* =====================================================
               일본어
            ====================================================== */

            ja: {

                title: "緊急連絡先",

                locPrefix: "位置",

                numPrefix: "エレベーター番号",

                btnCall:
                    "駅係員に\n電話する",

                btnSms:
                    "SMSを送信\n(1577-1234)"
            },


            /* =====================================================
               중국어
            ====================================================== */

            zh: {

                title: "紧急联系方式",

                locPrefix: "位置",

                numPrefix: "电梯编号",

                btnCall:
                    "拨打\n车站值班电话",

                btnSms:
                    "发送短信求助\n(1577-1234)"
            }

        };


        /* =========================================================
           언어 변경
        ========================================================== */

        function changeLanguage() {


            /* 현재 선택 언어 */

            const lang =
                document.getElementById("langSelect").value;


            /* =====================================================
               HTML lang 변경
            ====================================================== */

            let htmlLang = lang;

            if (lang === "zh") {

                htmlLang = "zh-CN";
            }

            document.documentElement.lang = htmlLang;


            /* =====================================================
               CSS 언어별 폰트 변경
            ====================================================== */

            document.documentElement.dataset.lang = lang;


            /* =====================================================
               제목
            ====================================================== */

            document.getElementById("pageTitle").textContent =
                langData[lang].title;


            /* =====================================================
               위치
            ====================================================== */

            document.getElementById("locLabel").textContent =
                langData[lang].locPrefix;


            document.getElementById("locValue").textContent =
                elevatorInfo.location[lang];


            /* =====================================================
               승강기 번호
            ====================================================== */

            document.getElementById("numLabel").textContent =
                langData[lang].numPrefix;


            document.getElementById("numValue").textContent =
                elevatorInfo.number;


            /* =====================================================
               전화 버튼
            ====================================================== */

            document.getElementById("btnCall").textContent =
                langData[lang].btnCall;


            /* =====================================================
               SMS 버튼
            ====================================================== */

            document.getElementById("btnSms").textContent =
                langData[lang].btnSms;

        }


        /* =========================================================
           SMS 신고

           ★ 중요 ★

           화면에서 영어 / 일본어 / 중국어를 선택해도
           실제 SMS 내용은 항상 한국어로 전송.

           신고 접수자가 한국의 역무/관제 담당자이므로
           신고 내용은 한국어로 통일.
        ========================================================== */

        function sendSMS() {


            /* =====================================================
               SMS 내용 - 항상 한국어
            ====================================================== */

            const message =
`[승강기 갇힘 신고]
- 위치: ${elevatorInfo.location.ko}
- 승강기번호: ${elevatorInfo.number}
승강기에 갇혔습니다. 신속한 구조 바랍니다.`;


            /* =====================================================
               SMS 수신번호
            ====================================================== */

            const targetNumber = "15771234";


            /* =====================================================
               사용자 기기 확인
            ====================================================== */

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            let smsUrl = "";


            /* =====================================================
               iPhone / iPad

               iOS에서는 &body= 방식 사용
            ====================================================== */

            if (
                /iPad|iPhone|iPod/.test(userAgent) &&
                !window.MSStream
            ) {

                smsUrl =
                    `sms:${targetNumber}&body=${encodeURIComponent(message)}`;

            }


            /* =====================================================
               Android / 기타
            ====================================================== */

            else {

                smsUrl =
                    `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }


            /* =====================================================
               문자 앱 실행
            ====================================================== */

            window.location.href = smsUrl;

        }


        /* =========================================================
           페이지 최초 실행
        ========================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                changeLanguage();

            }
        );


    </script>


</body>

</html>
