<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>갇힘 신고</title>
    <style>
        /* 1. 라이트 모드 배경 설정 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f7f9fa; /* 연한 회색 배경 */
            color: #231f20; /* CI Black (R35 G31 B32) */
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff; /* 컨테이너는 완전한 흰색 */
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); /* 부드러운 그림자 */
            border: 1px solid #e0e0e0;
        }
        
        /* 다국어 선택창 (라이트 모드 스타일에 맞게 변경) */
        .lang-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            background-color: #ffffff;
            color: #231f20;
            border: 1px solid #666c71; /* CI SM Gray (R102 G108 B113) */
            text-align: center;
            font-weight: bold;
        }
        
        /* 2. 타이틀 (비율 2.0 = 48px) - CI SM Blue 적용 */
        h1 { 
            color: #293896; /* CI SM Blue (R41 G56 B150) */
            font-size: 48px; 
            margin: 10px 0 25px 0; 
            word-break: keep-all;
            font-weight: 900;
            letter-spacing: -1.5px;
        }
        
        /* 3. 승강기 위치 정보 박스 (비율 1.0 = 24px) */
        .info-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center; 
            border: 2px solid #666c71; /* CI SM Gray (R102 G108 B113) */
        }
        .info-box p { margin: 10px 0; line-height: 1.6; }
        .label { font-size: 24px; color: #666c71; font-weight: bold; } /* CI SM Gray */
        .value { font-size: 24px; color: #231f20; font-weight: 900; } /* CI Black */
        
        /* 4. 공통 버튼 스타일 (비율 1.5 = 36px) - 둥근 직사각형(Apple 스타일) */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 140px;
            margin-bottom: 20px;
            border-radius: 20px; /* 둥글게 */
            font-size: 36px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            word-break: keep-all;
            line-height: 1.3;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            letter-spacing: -1px;
        }
        
        /* 5. 문자 신고 버튼 (위, 흰색 배경 + 검은 글씨 + 테두리) - BUTTON 이미지 참고 */
        .btn-sms { 
            background-color: #ffffff; 
            color: #000000;
            border: 3px solid #d1d1d6; /* 연한 회색 테두리 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        } 
        .btn-sms:active { 
            background-color: #f0f0f5; 
            transform: scale(0.98); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 6. 전화 연결 버튼 (아래, 주황/빨강 배경 + 흰 글씨) - BUTTON 이미지 참고 */
        .btn-call { 
            background-color: #ff3b30; /* 눈에 띄는 SOS 레드/오렌지 */
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 15px rgba(255, 59, 48, 0.4);
        } 
        .btn-call:active { 
            background-color: #d73229; 
            transform: scale(0.98); 
            box-shadow: 0 3px 8px rgba(255, 59, 48, 0.4);
        } 
    </style>
</head>
<body>

    <div class="container">
        <!-- 4개 국어 선택 -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <!-- 타이틀 변경 (갇힘 신고) -->
        <h1 id="pageTitle">갇힘 신고</h1>
        
        <!-- 엘리베이터 위치 정보 -->
        <div class="info-box">
            <p>
                <span id="locLabel" class="label">위치</span><br>
                <span id="locValue" class="value">신금호역 엘리베이터 3호기</span>
            </p>
        </div>

        <!-- 1. 문자 신고 버튼 (상단, 흰색 배경 스타일) -->
        <button class="btn btn-sms" id="btnSms" onclick="sendSMS()">
            1577-1234<br>문자 신고
        </button>

        <!-- 2. 전화 연결 버튼 (하단, 빨강/주황 배경 스타일) -->
        <a href="tel:02-6311-5382" class="btn btn-call" id="btnCall">
            역무실<br>통화 연결
        </a>
    </div>

    <script>
        // 1, 2호기 추가된 엘리베이터 데이터베이스
        const elevatorDatabase = {
            "1": { // 3호기 (기존)
                locationKo: "신금호역 엘리베이터 3호기",
                locationEn: "Singumho Station Elevator No.3",
                locationJa: "新金湖駅 エレベーター3号機",
                locationZh: "新金湖站 3号电梯",
                phone: "02-6311-5382"
            },
            "2": { // 1호기 (추가)
                locationKo: "신금호역 엘리베이터 1호기",
                locationEn: "Singumho Station Elevator No.1",
                locationJa: "新金湖駅 エレベーター1号機",
                locationZh: "新金湖站 1号电梯",
                phone: "02-6311-5382"
            },
            "3": { // 2호기 (추가)
                locationKo: "신금호역 엘리베이터 2호기",
                locationEn: "Singumho Station Elevator No.2",
                locationJa: "新金湖駅 エレベーター2号機",
                locationZh: "新金湖站 2号电梯",
                phone: "02-6311-5382"
            }
        };

        // URL 파라미터 추출 (?id=1, ?id=2, ?id=3)
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id') || "1"; // 기본값 1 (3호기)

        // 해당 승강기 정보 불러오기
        const currentElevator = elevatorDatabase[currentId] || {
            locationKo: "신금호역 엘리베이터 3호기",
            locationEn: "Singumho Station Elevator No.3",
            locationJa: "新金湖駅 エレベーター3号機",
            locationZh: "新金湖站 3号电梯",
            phone: "02-6311-5382"
        };

        // 4개 언어 텍스트 정의 (타이틀 '갇힘 신고'에 맞게 수정)
        const langData = {
            ko: {
                title: "갇힘 신고",
                locPrefix: "위치",
                btnSms: "1577-1234\n문자 신고",
                btnCall: "역무실\n통화 연결",
                getSmsBody: (loc) => `[승강기 갇힘 신고]\n- 위치: ${loc}\n승강기에 갇혔습니다. 신속한 구조 바랍니다.`
            },
            en: {
                title: "Trapped Report", // 의미에 맞게 변경
                locPrefix: "Location",
                btnSms: "Send SMS\n(1577-1234)",
                btnCall: "Call Station\nStaff",
                getSmsBody: (loc) => `[Elevator Emergency]\n- Location: ${loc}\nI am stuck in the elevator. Please help.`
            },
            ja: {
                title: "閉じ込め通報", // 의미에 맞게 변경
                locPrefix: "位置",
                btnSms: "SMSを送信\n(1577-1234)",
                btnCall: "駅係員に\n電話する",
                getSmsBody: (loc) => `[エレベーター閉じ込め]\n- 位置: ${loc}\nエレベーターに閉じ込められました。救助をお願いします。`
            },
            zh: {
                title: "困人报警", // 의미에 맞게 변경
                locPrefix: "位置",
                btnSms: "发送报警短信\n(1577-1234)",
                btnCall: "拨打\n值班室电话",
                getSmsBody: (loc) => `[电梯困人报警]\n- 位置: ${loc}\n我被困在电梯里了，请速来救援。`
            }
        };

        function getCurrentLocation(lang) {
            if (lang === 'en') return currentElevator.locationEn || currentElevator.locationKo;
            if (lang === 'ja') return currentElevator.locationJa || currentElevator.locationKo;
            if (lang === 'zh') return currentElevator.locationZh || currentElevator.locationKo;
            return currentElevator.locationKo;
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            
            document.getElementById('pageTitle').innerText = langData[lang].title;
            document.getElementById('locLabel').innerText = langData[lang].locPrefix;
            document.getElementById('locValue').innerText = locText;
            
            document.getElementById('btnSms').innerHTML = langData[lang].btnSms.replace(/\n/g, '<br>');
            document.getElementById('btnCall').innerHTML = langData[lang].btnCall.replace(/\n/g, '<br>');
            
            document.getElementById('btnCall').href = "tel:" + currentElevator.phone;
        }

        function sendSMS() {
            const lang = document.getElementById('langSelect').value;
            const locText = getCurrentLocation(lang);
            const message = langData[lang].getSmsBody(locText);
            const targetNumber = "15771234";
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let smsUrl = "";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                smsUrl = `sms:${targetNumber}&body=${encodeURIComponent(message)}`;
            } else {
                smsUrl = `sms:${targetNumber}?body=${encodeURIComponent(message)}`;
            }
            
            window.location.href = smsUrl;
        }

        window.onload = function() {
            changeLanguage();
        };
    </script>
</body>
</html>
